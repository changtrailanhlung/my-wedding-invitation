<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Thiệp Cưới Biển Trời</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,500&display=swap">
<style id="css">
/* Layout: một cột thiệp mời hẹp ở giữa nền xanh khói, bìa toàn khung, ảnh cô dâu chú rể dạng vòm */
:root{
  --bg:#E9EEF4; --surface:#FBFCFD; --ink:#1C2735; --muted:#5A6879; --line:#D5DDE6;
  --accent:#A64B63; --accent-ink:#FFFFFF; --sea:#2F5B7C; --tint:#EFF3F8;
  --hero-a:#24435C; --hero-b:#5C4A6E; --hero-c:#B5667B; --on-hero:#FFFFFF;
  --font-display:"Playfair Display",Georgia,"Times New Roman",serif;
  --font-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A0F15; --surface:#121B25; --ink:#EAF0F6; --muted:#9BAABB; --line:#2A3745;
  --accent:#E58DA3; --accent-ink:#2A1018; --sea:#82B4D8; --tint:#192431; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0F15; --surface:#121B25; --ink:#EAF0F6; --muted:#9BAABB; --line:#2A3745;
  --accent:#E58DA3; --accent-ink:#2A1018; --sea:#82B4D8; --tint:#192431; color-scheme:dark}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pre{white-space:pre-line}
.page{max-width:560px;margin:0 auto;background:var(--surface);box-shadow:0 0 0 1px var(--line)}
h1,h2,h3{font-family:var(--font-display);font-weight:400;margin:0;text-wrap:balance}
.eyebrow{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
.sec{padding:60px 28px;text-align:center}
.sec h2{font-size:30px;font-style:italic;margin-bottom:18px}
.sec p{margin:0 auto;max-width:44ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 22px;border-radius:999px;
  border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);text-decoration:none;cursor:pointer;font-size:14px;font-weight:500}
.btn.ghost{background:transparent;color:var(--accent)}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:24px}

.hero{position:relative;min-height:700px;display:grid;place-items:center;text-align:center;color:var(--on-hero);padding:56px 24px;overflow:hidden;isolation:isolate}
.hero .slot{position:absolute;inset:0;z-index:-2}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(10,18,28,.35),rgba(10,18,28,.15) 40%,rgba(10,18,28,.7))}
.hero .eyebrow{color:var(--on-hero);opacity:.9}
.names{font-size:clamp(44px,13vw,68px);font-style:italic;line-height:1.05;margin:6px 0}
.names .amp{display:block;font-size:.42em;font-style:normal;letter-spacing:.2em;margin:4px 0;opacity:.9}
.hero-date{font-size:15px;letter-spacing:.3em;margin:22px 0 6px}
.hero-city{font-size:12px;letter-spacing:.2em;text-transform:uppercase;opacity:.9;margin:0 0 30px}
.hero .btn{background:var(--on-hero);border-color:var(--on-hero);color:#1C2735}

.slot{position:relative;background-color:var(--tint);background-size:cover;background-position:center;display:grid;place-items:center;color:var(--muted);font-size:13px}
.slot.empty{background-image:linear-gradient(160deg,var(--hero-a),var(--hero-b) 65%,var(--hero-c));color:rgba(255,255,255,.8)}
.slot.empty::before{content:"Ảnh của bạn";letter-spacing:.12em;text-transform:uppercase;font-size:11px}
.hero .slot.empty::before{content:""}
.slot .ov{display:none}
body.editing .slot{cursor:pointer;outline:2px dashed var(--accent);outline-offset:-6px}
body.editing .slot .ov{display:block;position:absolute;right:10px;bottom:10px;background:var(--accent);color:var(--accent-ink);font-size:12px;padding:5px 12px;border-radius:999px}

.day-num{font-family:var(--font-display);font-size:clamp(96px,30vw,140px);line-height:1;color:var(--accent);font-style:italic}
.day-month{font-size:18px;letter-spacing:.14em;text-transform:uppercase;margin-top:4px}
.day-week{color:var(--muted);margin-top:4px}
.tint{background:var(--tint)}

.arch{width:min(320px,100%);aspect-ratio:4/5;margin:0 auto 34px;border-radius:999px 999px 6px 6px;overflow:hidden}
.arch .slot{width:100%;height:100%}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px;text-align:center;margin-top:8px}
.pair h3{font-size:22px;font-style:italic;margin-top:4px}
.pair .role{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.story{margin-top:30px!important;color:var(--muted)}
.family{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:34px;padding-top:28px;border-top:1px solid var(--line)}
.family h4{margin:0 0 6px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:500}
.family p{font-size:14px;max-width:none}

.album{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 8px 60px}
.album .slot{aspect-ratio:3/4}

.facts{display:grid;gap:22px;margin-top:30px;text-align:center}
.facts dt{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.facts dd{margin:0;font-size:16px}
.facts dd small{display:block;color:var(--muted);font-size:14px}

.count{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:26px}
.count div{background:var(--surface);border:1px solid var(--line);padding:16px 4px;border-radius:4px}
.count b{display:block;font-family:var(--font-display);font-size:32px;font-weight:400;color:var(--accent);font-variant-numeric:tabular-nums}
.count span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

form{display:grid;gap:14px;margin-top:26px;text-align:left}
label{display:grid;gap:6px;font-size:13px;color:var(--muted)}
input,select,textarea{width:100%;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink)}
textarea{min-height:76px;resize:vertical}
.note{margin-top:18px!important;padding:16px;border:1px solid var(--accent);border-radius:4px;font-size:14px;text-align:left}
.note .btn-row{justify-content:flex-start;margin-top:12px}

.gift{display:grid;gap:6px;margin-top:22px;padding:22px;border:1px solid var(--line);background:var(--surface);border-radius:4px}
.gift .acc{font-family:var(--font-display);font-size:28px;letter-spacing:.06em;font-variant-numeric:tabular-nums}
.gift .slot{width:160px;aspect-ratio:1;margin:12px auto 0}

.thanks{padding:64px 28px;text-align:center;background:linear-gradient(160deg,var(--hero-a),var(--hero-b) 70%,var(--hero-c));color:var(--on-hero)}
.thanks p{margin:0 auto 18px;max-width:30ch;font-family:var(--font-display);font-size:22px;font-style:italic;line-height:1.5}
.thanks small{letter-spacing:.2em;font-size:12px}

/* Trang quản trị (chỉ người có quyền sửa mới thấy) */
.fab{position:fixed;z-index:30;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  min-height:48px;padding:0 20px;border-radius:999px;border:0;background:var(--ink);color:var(--surface);cursor:pointer;font-weight:500;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.drawer{position:fixed;z-index:40;top:0;bottom:0;right:0;width:min(400px,100%);background:var(--surface);color:var(--ink);border-left:1px solid var(--line);
  display:none;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.18)}
.drawer.open{display:flex}
.dh{display:grid;gap:4px;padding:calc(14px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) 14px 16px;border-bottom:1px solid var(--line)}
.dh .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dh h2{font-size:20px;font-style:italic}
.dh .status{font-size:12.5px;color:var(--muted)}
.dh .status.dirty{color:var(--accent);font-weight:500}
.db{overflow:auto;padding:8px calc(16px + env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) 16px;display:grid;gap:14px;align-content:start}
.db h3{font-family:var(--font-body);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin:18px 0 0;font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.img-row{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:center;font-size:13px}
.img-row .th{width:56px;height:56px;border-radius:4px;background:var(--tint) center/cover}
.img-row .acts{display:flex;gap:6px}
.sm{min-height:36px;padding:0 12px;border:1px solid var(--line);background:var(--surface);border-radius:999px;cursor:pointer;font-size:13px}
.sm.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sm[disabled]{opacity:.5;cursor:default}
.help{font-size:12.5px;color:var(--muted);margin:0}
.toast{position:fixed;z-index:60;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:999px;font-size:13px;max-width:calc(100% - 32px);text-align:center}
@media (max-width:420px){.pair,.family{grid-template-columns:1fr}.sec{padding:52px 22px}}
</style>

</head>
<body>
<template id="tpl">
<main class="page">
  <header class="hero" id="top">
    <div class="slot cover" data-img="cover" role="button" tabindex="0" aria-label="Ảnh bìa"><span class="ov">Đổi ảnh bìa</span></div>
    <div>
      <p class="eyebrow" data-t="eyebrow"></p>
      <h1 class="names"><span data-t="groomName"></span><span class="amp">&amp;</span><span data-t="brideName"></span></h1>
      <p class="hero-date" id="heroDate"></p>
      <p class="hero-city" data-t="city"></p>
      <a class="btn" href="#ngay">Mở thiệp</a>
    </div>
  </header>

  <section class="sec" id="ngay">
    <p class="eyebrow">Ngày chung vui</p>
    <p class="pre" style="margin-bottom:10px">Xin dành thời gian cùng đôi trẻ vào ngày</p>
    <div class="day-num" id="dayNum"></div>
    <div class="day-month" id="dayMonth"></div>
    <div class="day-week" id="dayWeek"></div>
    <div class="btn-row"><a class="btn ghost" id="calLink" href="#" target="_blank" rel="noopener">Thêm vào Google Calendar</a></div>
  </section>

  <section class="sec tint">
    <p class="eyebrow">Lời mời</p>
    <p class="pre" data-t="invite" style="font-size:17px;line-height:1.8"></p>
    <h2 style="margin-top:22px"><span data-t="groomName"></span> &amp; <span data-t="brideName"></span></h2>
  </section>

  <section class="sec">
    <p class="eyebrow">Cô dâu &amp; Chú rể</p>
    <div class="arch"><div class="slot" data-img="couple" role="button" tabindex="0" aria-label="Ảnh cô dâu chú rể"><span class="ov">Đổi ảnh</span></div></div>
    <div class="pair">
      <div><div class="role">Chú rể</div><h3 data-t="groomFull"></h3></div>
      <div><div class="role">Cô dâu</div><h3 data-t="brideFull"></h3></div>
    </div>
    <p class="pre story" data-t="story"></p>
    <div class="family">
      <div><h4>Nhà trai</h4><p class="pre" data-t="groomFamily"></p></div>
      <div><h4>Nhà gái</h4><p class="pre" data-t="brideFamily"></p></div>
    </div>
  </section>

  <div class="album">
    <div class="slot" data-img="g1" role="button" tabindex="0"><span class="ov">Đổi ảnh</span></div>
    <div class="slot" data-img="g2" role="button" tabindex="0"><span class="ov">Đổi ảnh</span></div>
    <div class="slot" data-img="g3" role="button" tabindex="0"><span class="ov">Đổi ảnh</span></div>
    <div class="slot" data-img="g4" role="button" tabindex="0"><span class="ov">Đổi ảnh</span></div>
  </div>

  <section class="sec tint">
    <p class="eyebrow">Tiệc báo hỷ</p>
    <h2>Rất mong được đón tiếp Quý vị</h2>
    <dl class="facts">
      <div><dt>Thời gian</dt><dd id="timeLine"></dd></div>
      <div><dt>Địa điểm</dt><dd><span data-t="hall"></span><small data-t="venue"></small></dd></div>
      <div><dt>Địa chỉ</dt><dd data-t="address"></dd></div>
      <div id="dressRow"><dt>Trang phục</dt><dd data-t="dress"></dd></div>
    </dl>
    <div class="btn-row"><a class="btn" id="mapLink" href="#" target="_blank" rel="noopener">Chỉ đường bằng Google Maps</a></div>
  </section>

  <section class="sec">
    <p class="eyebrow">Đếm ngược</p>
    <h2>Ngày chung vui sắp đến rồi</h2>
    <div class="count" id="count">
      <div><b id="cd">00</b><span>Ngày</span></div>
      <div><b id="ch">00</b><span>Giờ</span></div>
      <div><b id="cm">00</b><span>Phút</span></div>
      <div><b id="cs">00</b><span>Giây</span></div>
    </div>
  </section>

  <section class="sec tint" id="rsvp">
    <p class="eyebrow">RSVP</p>
    <h2>Xác nhận tham dự</h2>
    <p>Để gia đình đón tiếp chu đáo, kính mong Quý khách xác nhận trước ngày <b id="rsvpDate"></b>.</p>
    <form id="rsvpForm">
      <label for="gName">Họ và tên<input id="gName" required autocomplete="name"></label>
      <label for="gCount">Số người tham dự
        <select id="gCount"><option>1 người</option><option selected>2 người</option><option>3 người</option><option>4 người</option><option>5 người trở lên</option><option>Rất tiếc, không đến được</option></select></label>
      <label for="gNote">Lời chúc hoặc ghi chú<textarea id="gNote"></textarea></label>
      <button class="btn" type="submit">Soạn lời xác nhận</button>
    </form>
    <div class="note" id="rsvpDone" hidden>
      <b>Lời xác nhận đã được sao chép.</b> Hãy dán và gửi cho <span data-t="contactName"></span> qua Zalo hoặc tin nhắn. Số liên hệ: <b data-t="contactPhone"></b>
      <div class="pre" id="rsvpText" style="margin-top:10px;color:var(--muted)"></div>
      <div class="btn-row"><a class="btn" id="zaloLink" href="#" target="_blank" rel="noopener">Mở Zalo</a><button class="btn ghost" type="button" id="copyAgain">Sao chép lại</button></div>
    </div>
  </section>

  <section class="sec" id="giftSec">
    <p class="eyebrow">Mừng cưới</p>
    <h2>Hộp mừng cưới</h2>
    <p>Sự hiện diện của Quý khách là niềm vui lớn nhất. Nếu muốn gửi lời chúc qua chuyển khoản, xin dùng thông tin dưới đây.</p>
    <div class="gift">
      <div class="eyebrow" style="margin:0" data-t="bankName"></div>
      <div class="acc" data-t="bankAcc"></div>
      <div data-t="bankHolder"></div>
      <div class="btn-row" style="margin-top:12px"><button class="btn ghost" type="button" id="copyAcc">Sao chép số tài khoản</button></div>
      <div class="slot" data-img="qr" role="button" tabindex="0" id="qrSlot"><span class="ov">Đổi mã QR</span></div>
    </div>
  </section>

  <footer class="thanks">
    <p class="pre" data-t="thanks"></p>
    <small><span data-t="groomName"></span> &amp; <span data-t="brideName"></span></small>
  </footer>
</main>
</template>

<template id="admintpl">
<button class="fab" id="fab" type="button">✎ Quản trị thiệp</button>
<aside class="drawer" id="drawer" aria-label="Quản trị thiệp">
  <div class="dh">
    <div class="top"><h2>Quản trị thiệp</h2><button class="sm" type="button" id="closeDrawer">Thu gọn</button></div>
    <div class="status" id="status">Chưa có thay đổi</div>
    <div class="row2" style="margin-top:8px"><button class="sm pri" type="button" id="publishBtn" disabled>Lưu và đăng thiệp</button><button class="sm" type="button" id="revertBtn" disabled>Hủy thay đổi</button></div>
  </div>
  <div class="db" id="formBox"></div>
</aside>
</template>

<div id="root"></div>
<div class="toast" id="toast" role="status" hidden></div>
<input type="file" accept="image/*" id="filePick" hidden>

<script type="text/plain" id="src-js">

const RESET = ':root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}';

  ['Cô dâu & chú rể',[['groomName','Tên chú rể (ngắn)'],['brideName','Tên cô dâu (ngắn)'],['groomFull','Họ tên đầy đủ chú rể'],['brideFull','Họ tên đầy đủ cô dâu'],['eyebrow','Dòng tiêu đề trên bìa'],['city','Thành phố trên bìa']]],
  ['Thời gian',[['date','Ngày tổ chức','date'],['receptionTime','Giờ đón khách','time'],['startTime','Giờ khai tiệc','time'],['rsvpDeadline','Hạn xác nhận tham dự','date']]],
  ['Địa điểm',[['venue','Tên nhà hàng / trung tâm tiệc cưới'],['hall','Tên sảnh'],['address','Địa chỉ','area'],['dress','Gợi ý trang phục','area']]],
  ['Lời văn',[['invite','Lời mời','area'],['story','Câu chuyện của đôi bạn','area'],['thanks','Lời cảm ơn cuối thiệp','area']]],
  ['Gia đình',[['groomFamily','Nhà trai (mỗi dòng một người)','area'],['brideFamily','Nhà gái (mỗi dòng một người)','area']]],
  ['Liên hệ & mừng cưới',[['contactName','Người nhận xác nhận'],['contactPhone','Số điện thoại / Zalo'],['bankName','Ngân hàng'],['bankAcc','Số tài khoản (để trống nếu muốn ẩn phần mừng cưới)'],['bankHolder','Chủ tài khoản']]]
];
const IMGS = [['cover','Ảnh bìa'],['couple','Ảnh cô dâu chú rể'],['g1','Album 1'],['g2','Album 2'],['g3','Album 3'],['g4','Album 4'],['qr','Mã QR mừng cưới']];
const WEEK = ['Chủ Nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const pad = n => String(n).padStart(2,'0');

let state = JSON.parse(JSON.stringify(DATA));
let isAdmin = false, changed = false, artifactNs = null, assetsNs = null;

let tt; function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(tt); tt=setTimeout(()=>t.hidden=true,3600); }
function parseDate(v){ const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v||''); if(!m) return null;
  const y=+m[1], mo=+m[2], d=+m[3]; return {y,mo,d,wd:WEEK[new Date(y,mo-1,d).getDay()],txt:`${pad(d)}.${pad(mo)}.${y}`}; }
const gcal = d => d.toISOString().replace(/[-:]|\.\d{3}/g,'');
const imgUrl = id => '/_blob/' + id;

function render(){
  $$('[data-t]').forEach(el => el.textContent = state[el.dataset.t] || '');
  const dt = parseDate(state.date);
  $('#heroDate').textContent = dt ? `${pad(dt.d)} · ${pad(dt.mo)} · ${dt.y}` : '';
  $('#dayNum').textContent = dt ? pad(dt.d) : '--';
  $('#dayMonth').textContent = dt ? `Tháng ${dt.mo} ${dt.y}` : '';
  $('#dayWeek').textContent = dt ? dt.wd : '';
  const tl = $('#timeLine'); tl.textContent = `Đón khách ${state.receptionTime} · Khai tiệc ${state.startTime}`;
  const small = document.createElement('small'); small.textContent = dt ? `${dt.wd}, ${dt.txt}` : ''; tl.append(small);
  const rd = parseDate(state.rsvpDeadline); $('#rsvpDate').textContent = rd ? rd.txt : '';
  $('#dressRow').hidden = !state.dress.trim();
  $('#giftSec').hidden = !state.bankAcc.trim();
  const place = `${state.venue} ${state.address}`.trim();
  $('#mapLink').href = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(place);
  const digits = state.contactPhone.replace(/\D/g,'');
  $('#zaloLink').href = digits ? 'https://zalo.me/' + digits : '#';
  if (dt) {
    const start = new Date(`${state.date}T${state.receptionTime}:00+07:00`);
    if (!isNaN(start)) {
      const end = new Date(start.getTime() + 4*3600*1000);
      $('#calLink').href = 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' +
        encodeURIComponent(`Đám cưới ${state.groomName} & ${state.brideName}`) + `&dates=${gcal(start)}/${gcal(end)}` +
        '&details=' + encodeURIComponent(`Đón khách ${state.receptionTime}, khai tiệc ${state.startTime}`) +
        '&location=' + encodeURIComponent(place);
    }
  }
  document.title = `${state.groomName} & ${state.brideName}`;
  $$('.slot[data-img]').forEach(el => {
    const id = state.images[el.dataset.img];
    el.classList.toggle('empty', !id);
    el.style.backgroundImage = id ? `url("${imgUrl(id)}")` : '';
  });
  tick();
}
function tick(){
  const target = new Date(`${state.date}T${state.startTime}:00+07:00`).getTime();
  const s = Math.floor((isNaN(target) ? 0 : Math.max(0, target - Date.now()))/1000);
  $('#cd').textContent = pad(Math.floor(s/86400));
  $('#ch').textContent = pad(Math.floor(s%86400/3600));
  $('#cm').textContent = pad(Math.floor(s%3600/60));
  $('#cs').textContent = pad(s%60);
}

function copyText(text, okMsg){
  const fallback = () => { const t=document.createElement('textarea'); t.value=text; document.body.append(t); t.select();
    let ok=false; try{ ok=document.execCommand('copy'); }catch(e){} t.remove(); toast(ok ? okMsg : 'Không sao chép được, hãy chọn và sao chép thủ công.'); };
  try { navigator.clipboard.writeText(text).then(()=>toast(okMsg), fallback); } catch(e){ fallback(); }
}

/* ===== Khách: RSVP và mừng cưới ===== */
function initGuest(){
  let lastMsg = '';
  $('#rsvpForm').addEventListener('submit', e => {
    e.preventDefault();
    const dt = parseDate(state.date);
    lastMsg = `Xác nhận tham dự tiệc cưới ${state.groomName} & ${state.brideName}${dt ? ' ngày ' + dt.txt : ''}\n` +
      `Họ tên: ${$('#gName').value.trim()}\nSố người: ${$('#gCount').value}` + ($('#gNote').value.trim() ? `\nLời chúc: ${$('#gNote').value.trim()}` : '');
    $('#rsvpText').textContent = lastMsg; $('#rsvpDone').hidden = false;
    copyText(lastMsg, 'Đã sao chép lời xác nhận');
  });
  $('#copyAgain').addEventListener('click', () => copyText(lastMsg, 'Đã sao chép lời xác nhận'));
  $('#copyAcc').addEventListener('click', () => copyText(state.bankAcc.replace(/\s/g,''), 'Đã sao chép số tài khoản'));
}

/* ===== Quản trị: chỉ người có quyền sửa ===== */
function markChanged(){
  changed = true;
  $('#status').textContent = 'Có thay đổi chưa đăng. Khách chưa nhìn thấy.'; $('#status').classList.add('dirty');
  $('#publishBtn').disabled = false; $('#revertBtn').disabled = false;
}
function setEditing(on){ $('#drawer').classList.toggle('open', on); document.body.classList.toggle('editing', on); $('#fab').hidden = on; }
let pickKey = null;
function pickImage(key){
  if (!assetsNs) { toast('Chưa tải ảnh lên được ở chế độ xem này.'); return; }
  pickKey = key; $('#filePick').value=''; $('#filePick').click();
}
function buildForm(){
  const box = $('#formBox'); box.textContent = '';
  const p = document.createElement('p'); p.className='help';
  p.textContent = 'Sửa xong bấm "Lưu và đăng thiệp". Khách chỉ thấy bản đã đăng. Bạn cũng có thể bấm thẳng vào ảnh trên thiệp để đổi.';
  box.append(p);
  FIELDS.forEach(([title, list]) => {
    const h = document.createElement('h3'); h.textContent = title; box.append(h);
    list.forEach(([k,label,type]) => {
      const l = document.createElement('label'); l.htmlFor = 'f_'+k; l.append(label);
      const inp = document.createElement(type==='area' ? 'textarea' : 'input');
      inp.id = 'f_'+k; if (type && type!=='area') inp.type = type; inp.value = state[k] || '';
      inp.addEventListener('input', () => { state[k] = inp.value; markChanged(); render(); });
      l.append(inp); box.append(l);
    });
  });
  const h = document.createElement('h3'); h.textContent = 'Hình ảnh'; box.append(h);
  IMGS.forEach(([k,label]) => {
    const row = document.createElement('div'); row.className='img-row';
    const th = document.createElement('div'); th.className='th'; if (state.images[k]) th.style.backgroundImage = `url("${imgUrl(state.images[k])}")`;
    const nm = document.createElement('span'); nm.textContent = label;
    const acts = document.createElement('div'); acts.className='acts';
    const b1 = document.createElement('button'); b1.type='button'; b1.className='sm pri'; b1.textContent='Chọn ảnh'; b1.onclick=()=>pickImage(k);
    const b2 = document.createElement('button'); b2.type='button'; b2.className='sm'; b2.textContent='Xóa';
    b2.onclick=()=>{ delete state.images[k]; markChanged(); render(); buildForm(); };
    acts.append(b1,b2); row.append(th,nm,acts); box.append(row);
  });
  const h2 = document.createElement('h3'); h2.textContent = 'Làm lại từ đầu'; box.append(h2);
  const rs = document.createElement('button'); rs.type='button'; rs.className='sm'; rs.textContent='Đặt lại về mẫu ban đầu';
  let armed = false;
  rs.onclick = () => { if (!armed) { armed = true; rs.textContent='Bấm lần nữa để xóa toàn bộ nội dung'; setTimeout(()=>{armed=false; rs.textContent='Đặt lại về mẫu ban đầu';},3500); return; }
    state = JSON.parse(JSON.stringify(BLANK)); markChanged(); render(); buildForm(); };
  box.append(rs);
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function buildDoc(data){
  const jsSrc = document.getElementById('src-js').textContent.replace(/\/\*D\*\/[\s\S]*?\/\*E\*\//, () =>
    '/*D*/' + JSON.stringify(data).replace(/</g,'\\u003c').replace(/ /g,'\\u2028').replace(/ /g,'\\u2029') + '/*E*/');
  const content =
    '<title>' + esc(TITLE) + '</title>' +
    '<meta name="claude:viewport-fit-sides" content="cover">' +
    '<link rel="stylesheet" href="' + FONT_LINK + '">' +
    '<style id="css">' + document.getElementById('css').textContent + '</style>' +
    '<template id="tpl">' + document.getElementById('tpl').innerHTML + '</template>' +
    '<template id="admintpl">' + document.getElementById('admintpl').innerHTML + '</template>' +
    '<div id="root"></div><div class="toast" id="toast" role="status" hidden></div>' +
    '<input type="file" accept="image/*" id="filePick" hidden>' +
    '<script type="text/plain" id="src-js">' + jsSrc + '</scr' + 'ipt>' +
    '<script>' + LOADER + '</scr' + 'ipt>';
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' +
    RESET + '</style></head><body>' + content + '</body></html>';
}
async function publishNow(){
  if (!artifactNs) return;
  const btn = $('#publishBtn'); btn.disabled = true; btn.textContent = 'Đang đăng...';
  try { await artifactNs.publish(buildDoc(state)); toast('Đã đăng thiệp'); }
  catch (err) {
    btn.disabled = false; btn.textContent = 'Lưu và đăng thiệp';
    const c = err && err.code;
    if (c === 'conflict') toast('Thiệp vừa được cập nhật ở nơi khác. Trang sẽ tải lại.');
    else if (c === 'not_writer' || c === 'not_granted') toast('Tài khoản này chỉ có quyền xem, không đăng được.');
    else if (c === 'too_large') toast('Thiệp quá nặng, hãy giảm bớt ảnh hoặc chữ.');
    else if (c === 'rate_limited') toast('Bạn đăng quá nhanh, thử lại sau ít phút.');
    else toast('Chưa đăng được, hãy thử lại.');
  }
}
function initAdmin(){
  const frag = document.getElementById('admintpl').content.cloneNode(true);
  document.body.append(frag);
  $('#fab').addEventListener('click', () => { buildForm(); setEditing(true); });
  $('#closeDrawer').addEventListener('click', () => setEditing(false));
  $('#publishBtn').addEventListener('click', publishNow);
  $('#revertBtn').addEventListener('click', () => {
    state = JSON.parse(JSON.stringify(DATA)); changed = false; render(); buildForm();
    $('#status').textContent = 'Chưa có thay đổi'; $('#status').classList.remove('dirty');
    $('#publishBtn').disabled = true; $('#revertBtn').disabled = true;
  });
  $$('.slot[data-img]').forEach(el => {
    const go = () => { if (document.body.classList.contains('editing')) pickImage(el.dataset.img); };
    el.addEventListener('click', go);
    el.addEventListener('keydown', e => { if (e.key==='Enter'||e.key===' ') { e.preventDefault(); go(); } });
  });
  $('#filePick').addEventListener('change', e => {
    const f = e.target.files[0]; if (!f || !pickKey) return;
    const key = pickKey, r = new FileReader();
    r.onload = () => { const img = new Image(); img.onload = () => {
      const max = key==='qr' ? 700 : 1600, k = Math.min(1, max/Math.max(img.width,img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      c.toBlob(async blob => {
        try { const res = await assetsNs.upload(blob, {type:'image/jpeg'}); state.images[key] = res.id; markChanged(); render(); buildForm(); toast('Đã tải ảnh lên'); }
        catch (err) { toast('Không tải ảnh lên được (' + ((err && err.code) || 'lỗi') + ')'); }
      }, 'image/jpeg', .85);
    }; img.src = r.result; };
    r.readAsDataURL(f);
  });
}

async function start(){
  document.getElementById('root').append(document.getElementById('tpl').content.cloneNode(true));
  render(); initGuest();
  setInterval(tick, 1000);
  try {
    if (!(window.claude && claude.use)) return;
    const u = await claude.use('user');
    isAdmin = !!(u && typeof u.canEdit === 'function' && u.canEdit());
    if (!isAdmin) return;
    artifactNs = await claude.use('artifact');
    assetsNs = await claude.use('assets');
    if (artifactNs) initAdmin();
  } catch (e) {}
}
start();
</script>
<script>(function(){var s=document.createElement("script");s.textContent=document.getElementById("src-js").textContent;document.body.appendChild(s)})()</script>
</body>
</html>
